name: Build WatchDiscord IPA
on:
  workflow_dispatch:
jobs:
  build:
    name: Build IPA & Capture Watch UI
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Icon & Xcode Project
        run: |
          set -e
          brew install xcodegen
          mkdir -p Assets.xcassets/AppIcon.appiconset
          python3 -c '
          import zlib, struct
          W, H = 1024, 1024
          rows = []
          def in_rr(x, y, rx, ry, rw, rh, r):
              if x < rx or x >= rx+rw or y < ry or y >= ry+rh: return False
              cx = max(rx+r, min(x, rx+rw-r-1))
              cy = max(ry+r, min(y, ry+rh-r-1))
              return (x-cx)**2 + (y-cy)**2 <= r*r
          for y in range(H):
              row = bytearray([0])
              for x in range(W):
                  c = (88, 101, 242)
                  if (188 <= y < 276 and 368 + (y-188)*24//88 <= x < 656 - (y-188)*24//88) or (748 <= y < 836 and 392 - (y-748)*24//88 <= x < 632 + (y-748)*24//88):
                      c = (255, 255, 255)
                  if in_rr(x, y, 292, 268, 440, 488, 116) or in_rr(x, y, 748, 388, 40, 112, 16):
                      c = (255, 255, 255)
                  if in_rr(x, y, 334, 310, 356, 404, 84):
                      c = (59, 69, 196)
                  if in_rr(x, y, 352, 328, 320, 368, 70):
                      c = (42, 50, 158)
                  if in_rr(x, y, 418, 454, 54, 116, 27) or in_rr(x, y, 552, 454, 54, 116, 27):
                      c = (255, 255, 255)
                  row.extend(c)
              rows.append(bytes(row))
          raw = b"".join(rows)
          def chunk(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", W, H, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw, 6)) + chunk(b"IEND", b"")
          open("Assets.xcassets/AppIcon.appiconset/AppIcon.png", "wb").write(png)
          '
          printf '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"},{"filename":"AppIcon.png","idiom":"universal","platform":"watchos","size":"1024x1024"}],"info":{"author":"xcode","version":1}}\n' > Assets.xcassets/AppIcon.appiconset/Contents.json
          xcodegen generate
      - name: Build Device IPA
        run: xcodebuild archive -project WatchDiscord.xcodeproj -scheme WatchDiscord -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/WatchDiscord.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -quiet && mkdir -p Payload && cp -r "$RUNNER_TEMP/WatchDiscord.xcarchive/Products/Applications/"*.app Payload/ && zip -r WatchDiscord.ipa Payload
      - name: Capture Real watchOS Simulator PNGs
        run: |
          set -e
          mkdir -p screenshots
          SIM_ID=$(xcrun simctl list devices available | grep -E "Apple Watch Series (9|10|Ultra)" | head -n 1 | grep -oE "[A-F0-9-]{36}")
          echo "Using Simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID"
          xcodebuild build -project WatchDiscord.xcodeproj -scheme WatchDiscordWatch -configuration Debug -destination "id=$SIM_ID" -derivedDataPath "$RUNNER_TEMP/SimBuild" CODE_SIGN_ALLOWED=NO -quiet
          WATCH_APP=$(find "$RUNNER_TEMP/SimBuild/Build/Products" -name "WatchDiscordWatch.app" | head -n 1)
          xcrun simctl install "$SIM_ID" "$WATCH_APP"
          xcrun simctl launch "$SIM_ID" com.personal.watchdiscord.watchkitapp -DEMO_MODE
          sleep 5
          xcrun simctl io "$SIM_ID" screenshot screenshots/watch_screen_1.png
          sleep 2
          xcrun simctl io "$SIM_ID" screenshot screenshots/watch_screen_2.png
      - uses: actions/upload-artifact@v4
        with:
          name: WatchDiscord-IPA
          path: WatchDiscord.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WatchDiscord-Screenshots
          path: screenshots/*.png
