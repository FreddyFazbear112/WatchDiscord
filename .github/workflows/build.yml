name: Build WatchDiscord IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned IPA
        run: |
          set -e
          xcodebuild archive \
            -project WatchDiscord.xcodeproj \
            -scheme WatchDiscord \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/WatchDiscord.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r $RUNNER_TEMP/WatchDiscord.xcarchive/Products/Applications/*.app Payload/
          zip -r WatchDiscord.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WatchDiscord-IPA
          path: WatchDiscord.ipa
