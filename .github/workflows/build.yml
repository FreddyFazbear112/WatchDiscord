name: Build WatchDiscord IPA
on:
  workflow_dispatch:
jobs:
  build:
    name: Build IPA & Capture Watch UI
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Icon & Xcode Project
        run: brew install librsvg xcodegen && mkdir -p Assets.xcassets/AppIcon.appiconset && rsvg-convert -w 1024 -h 1024 AppIcon.svg -o Assets.xcassets/AppIcon.appiconset/AppIcon.png && printf '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"},{"filename":"AppIcon.png","idiom":"universal","platform":"watchos","size":"1024x1024"}],"info":{"author":"xcode","version":1}}\n' > Assets.xcassets/AppIcon.appiconset/Contents.json && xcodegen generate
      - name: Build Device IPA
        run: xcodebuild archive -project WatchDiscord.xcodeproj -scheme WatchDiscord -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/WatchDiscord.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -quiet && mkdir -p Payload && cp -r "$RUNNER_TEMP/WatchDiscord.xcarchive/Products/Applications/"*.app Payload/ && zip -r WatchDiscord.ipa Payload
      - name: Capture Real watchOS Simulator PNGs
        run: |
          set -e
          mkdir -p screenshots
          SIM_ID=$(xcrun simctl list devices available | grep -E "Apple Watch Series (9|10|Ultra)" | head -n 1 | grep -oE "[A-F0-9-]{36}")
          echo "Using Simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID"
          xcodebuild build -project WatchDiscord.xcodeproj -scheme WatchDiscordWatch -configuration Debug -destination "id=$SIM_ID" -derivedDataPath "$RUNNER_TEMP/SimBuild" CODE_SIGNING_ALLOWED=NO -quiet
          WATCH_APP=$(find "$RUNNER_TEMP/SimBuild/Build/Products" -name "WatchDiscordWatch.app" | head -n 1)
          xcrun simctl install "$SIM_ID" "$WATCH_APP"
          xcrun simctl launch "$SIM_ID" com.personal.watchdiscord.watchkitapp -DEMO_MODE
          sleep 5
          xcrun simctl io "$SIM_ID" screenshot screenshots/watch_screen_1.png
          sleep 2
          xcrun simctl io "$SIM_ID" screenshot screenshots/watch_screen_2.png
      - uses: actions/upload-artifact@v4
        with:
          name: WatchDiscord-IPA
          path: WatchDiscord.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WatchDiscord-Screenshots
          path: screenshots/*.png
