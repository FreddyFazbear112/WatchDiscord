name: Build WatchDiscord IPA

on:
  workflow_dispatch:

concurrency:
  group: build-watchdiscord
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: brew install librsvg xcodegen
      - run: mkdir -p Assets.xcassets/AppIcon.appiconset
      - run: echo "" | base64 -d > icon.svg
      - run: rsvg-convert -w 1024 -h 1024 icon.svg -o Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - run: echo "eyJpbWFnZXMiOlt7ImZpbGVuYW1lIjoiQXBwSWNvbi5wbmciLCJpZGlvbSI6InVuaXZlcnNhbCIsInBsYXRmb3JtIjoiaW9zIiwic2l6ZSI6IjEwMjR4MTAyNCJ9LHsiZmlsZW5hbWUiOiJBcHBJY29uLnBuZyIsImlkaW9tIjoidW5pdmVyc2FsIiwicGxhdGZvcm0iOiJ3YXRjaG9zIiwic2l6ZSI6IjEwMjR4MTAyNCJ9XSwiaW5mbyI6eyJhdXRob3IiOiJ4Y29kZSIsInZlcnNpb24iOjF9fQ==" | base64 -d > Assets.xcassets/AppIcon.appiconset/Contents.json
      - run: xcodegen generate
      - run: xcodebuild build -project WatchDiscord.xcodeproj -scheme WatchDiscord -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DevBuild" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -quiet
      - run: mkdir -p Payload/WatchDiscord.app/Watch && cp -r "$RUNNER_TEMP/DevBuild/Build/Products/Release-iphoneos/WatchDiscord.app/"* Payload/WatchDiscord.app/ && rm -rf Payload/WatchDiscord.app/Watch/* && cp -r "$RUNNER_TEMP/DevBuild/Build/Products/Release-watchos/WatchDiscordWatch.app" Payload/WatchDiscord.app/Watch/ && zip -r WatchDiscord.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WatchDiscord-IPA
          path: WatchDiscord.ipa
