name: Build WatchDiscord IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install XcodeGen & Generate Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned iOS + watchOS Archive
        run: |
          xcodebuild archive \
            -project WatchDiscord.xcodeproj \
            -scheme WatchDiscord \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/WatchDiscord.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (Keeping Watch App Nested)
        run: |
          mkdir -p Payload
          cp -r $RUNNER_TEMP/WatchDiscord.xcarchive/Products/Applications/WatchDiscord.app Payload/
          zip -r WatchDiscord.ipa Payload

      - name: Upload WatchDiscord.ipa
        uses: actions/upload-artifact@v4
        with:
          name: WatchDiscord-IPA
          path: WatchDiscord.ipa
