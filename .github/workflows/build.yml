name: Build WatchDiscord IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: brew install librsvg xcodegen
      - run: mkdir -p Assets.xcassets/AppIcon.appiconset
      - run: printf '<svg xmlns="http://w3.org" width="1024" height="1024"><rect width="1024" height="1024" fill="#5865F2"/><path d="M368 188 L392 276 L632 276 L656 188 Z" fill="#FFF"/><path d="M368 836 L392 748 L632 748 L656 836 Z" fill="#FFF"/><rect x="292" y="268" width="440" height="488" rx="116" fill="#FFF"/><rect x="748" y="388" width="40" height="112" rx="16" fill="#FFF"/><rect x="334" y="310" width="356" height="404" rx="84" fill="#3B45C4"/><rect x="352" y="328" width="320" height="368" rx="70" fill="#2A329E"/><rect x="418" y="454" width="54" height="116" rx="27" fill="#FFF"/><rect x="552" y="454" width="54" height="116" rx="27" fill="#FFF"/></svg>' > icon.svg
      - run: rsvg-convert -w 1024 -h 1024 icon.svg -o Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - run: printf '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"},{"filename":"AppIcon.png","idiom":"universal","platform":"watchos","size":"1024x1024"}],"info":{"author":"xcode","version":1}}\n' > Assets.xcassets/AppIcon.appiconset/Contents.json
      - run: xcodegen generate
      - run: xcodebuild build -project WatchDiscord.xcodeproj -scheme WatchDiscord -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DevBuild" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -quiet
      - run: xcodebuild build -project WatchDiscord.xcodeproj -scheme WatchDiscordWatch -configuration Release -destination 'generic/platform=watchOS' -derivedDataPath "$RUNNER_TEMP/DevBuild" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -quiet
      - run: mkdir -p Payload/WatchDiscord.app/Watch && cp -r "$RUNNER_TEMP/DevBuild/Build/Products/Release-iphoneos/WatchDiscord.app/"* Payload/WatchDiscord.app/ && cp -r "$RUNNER_TEMP/DevBuild/Build/Products/Release-watchos/WatchDiscordWatch.app" Payload/WatchDiscord.app/Watch/ && zip -r WatchDiscord.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WatchDiscord-IPA
          path: WatchDiscord.ipa
