name: Build WatchDiscord

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive iOS app with embedded watch app
        run: |
          xcodebuild -project WatchDiscord.xcodeproj -scheme WatchDiscord \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WatchDiscord-iOS.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO
      - name: Verify embedded watch companion
        run: |
          APP="$RUNNER_TEMP/WatchDiscord-iOS.xcarchive/Products/Applications/WatchDiscord.app"
          test -d "$APP" || { echo "iOS app archive missing"; exit 1; }
          echo "Embedded app bundles:"
          find "$APP" -maxdepth 4 -type d -name '*.app' -print
          WATCH_APP="$(find "$APP/Watch" -maxdepth 2 -type d -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -z "$WATCH_APP" ]; then
            echo "::error::No watchOS companion found inside WatchDiscord.app/Watch."
            echo "Check the XcodeGen watch target dependency and embed build phase."
            exit 1
          fi
          echo "Verified watch companion: $WATCH_APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WATCH_APP/Info.plist"
      - name: Package combined unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/WatchDiscord-iOS.xcarchive/Products/Applications/WatchDiscord.app" "$RUNNER_TEMP/Payload/WatchDiscord.app"
          cd "$RUNNER_TEMP"
          zip -qry WatchDiscord-unsigned.ipa Payload
          unzip -l WatchDiscord-unsigned.ipa | grep -E 'Payload/WatchDiscord.app/Watch/.*\.app/'
      - uses: actions/upload-artifact@v4
        with:
          name: WatchDiscord-iOS-with-watch-companion-unsigned-ipa
          path: ${{ runner.temp }}/WatchDiscord-unsigned.ipa
          if-no-files-found: error

  build-watchos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive watchOS app
        run: xcodebuild -project WatchDiscord.xcodeproj -scheme WatchDiscordWatch -destination 'generic/platform=watchOS' -archivePath "$RUNNER_TEMP/WatchDiscord-watchOS.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: WatchDiscord-watchOS-archive
          path: ${{ runner.temp }}/WatchDiscord-watchOS.xcarchive
          if-no-files-found: error
