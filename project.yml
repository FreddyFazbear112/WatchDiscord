name: WatchDiscord
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

targets:
  WatchDiscord:
    type: application
    platform: iOS
    sources:
      - path: WatchDiscord
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - target: WatchDiscordWatch
        embed: true
        copy:
          destination: watch

  WatchDiscordWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchDiscordWatch
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: WatchDiscordWatch/WatchApp-Info.plist
      properties:
        CFBundleDisplayName: WatchDiscord
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.personal.watchdiscord
        NSMicrophoneUsageDescription: Used for voice calls on Discord.
