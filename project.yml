name: WatchDiscord
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

targets:
  WatchDiscord:
    type: application
    platform: iOS
    sources:
      - path: WatchDiscord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WatchDiscordWatch
        embed: true

  WatchDiscordWatch:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: WatchDiscordWatch
    info:
      path: WatchDiscordWatch/Info.plist
      properties:
        CFBundleDisplayName: WatchDiscord
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.personal.watchdiscord.VS635RJZ7M
        NSMicrophoneUsageDescription: Used for voice calls on Discord.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
