name: WatchDiscord
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

targets:
  WatchDiscord:
    type: application
    platform: iOS
    sources:
      - path: WatchDiscord
        excludes:
          - "**/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - target: WatchDiscordWatch
        embed: true

  WatchDiscordWatch:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: WatchDiscordWatch
        excludes:
          - "**/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WatchDiscord
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.personal.watchdiscord.VS635RJZ7M
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Used for voice calls on Discord.
