name: WatchDiscord
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

targets:
  WatchDiscord:
    type: application
    platform: iOS
    sources:
      - path: WatchDiscord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord.VS635RJZ7M
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - target: WatchDiscordWatch
        embed: true

  WatchDiscordWatch:
    type: application.watchapp2
    platform: watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord.VS635RJZ7M.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: WatchDiscordWatch/WatchApp-Info.plist
      properties:
        CFBundleDisplayName: WatchDiscord
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKWatchKitApp: true
        WKCompanionAppBundleIdentifier: com.personal.watchdiscord.VS635RJZ7M
    dependencies:
      - target: WatchDiscordWatchExtension
        embed: true

  WatchDiscordWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    sources:
      - path: WatchDiscordWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord.VS635RJZ7M.watchkitapp.watchkitextension
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: WatchDiscordWatch/WatchExt-Info.plist
      properties:
        CFBundleDisplayName: WatchDiscord
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: com.personal.watchdiscord.VS635RJZ7M.watchkitapp
          NSExtensionPointIdentifier: com.apple.watchkit
        NSMicrophoneUsageDescription: Used for voice calls on Discord.
