name: WatchDiscord
options:
  bundleIdPrefix: com.personal.watchdiscord
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

targets:
  WatchDiscord:
    type: application
    platform: iOS
    sources:
      - WatchDiscord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord
        INFOPLIST_KEY_CFBundleDisplayName: WatchDiscord
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WatchDiscordWatch
        embed: true

  WatchDiscordWatch:
    type: application
    platform: watchOS
    sources:
      - WatchDiscordWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.watchdiscord.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Discord
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.personal.watchdiscord
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used for Discord voice channels and calls."
        GENERATE_INFOPLIST_FILE: YES
