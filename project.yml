name: WatchDiscord
options:
  bundleIdPrefix: com.freddyfazbear
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
targets:
  WatchDiscord:
    type: application
    platform: iOS
    sources:
      - path: WatchDiscord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freddyfazbear.watchdiscord
        INFOPLIST_KEY_CFBundleDisplayName: WatchDiscord
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WatchDiscordWatch
        embed: true
  WatchDiscordWatch:
    type: watch2_app
    platform: watchOS
    sources:
      - path: WatchDiscordWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freddyfazbear.watchdiscord.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: WatchDiscord
        GENERATE_INFOPLIST_FILE: YES
